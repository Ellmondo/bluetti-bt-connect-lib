name: Publish to PyPI

# Publishing is what lets the Home Assistant integration pin a real version.
# With a bare git URL requirement, Home Assistant can only check whether a
# package of that name is installed - never whether it is current - so it
# silently keeps running whatever it installed first. A pinned PyPI version
# gives it something to compare against, and upgrades start working on their
# own.
#
# Pushing a tag vX.Y.Z runs the whole release: tests, build, publish to PyPI,
# then a GitHub release whose notes are the "## X.Y.Z" section of
# CHANGELOG.md. The GitHub release is created last, so it only appears once
# the package is on PyPI. (A release created by this workflow's token cannot
# start another workflow, which is why publishing is triggered by the tag
# rather than by the release.)
#
# workflow_dispatch re-publishes a version to PyPI by hand; it never creates
# a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish - must match __version__ in the package"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          for suite in tests tests/fields tests/registers tests/base_devices tests/bluetooth tests/devices; do
            [ -d "$suite" ] || continue
            echo "::group::$suite"
            python -m unittest discover -s "$suite" -p "*.py"
            echo "::endgroup::"
          done

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A tag that disagrees with the packaged __version__ would publish a
      # release whose metadata contradicts its own source. Refuse instead.
      - name: Resolve and verify version
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            REQUESTED="${{ github.ref_name }}"
          else
            REQUESTED="${{ inputs.version }}"
          fi
          REQUESTED="${REQUESTED#v}"
          PACKAGED="$(python -c "import re, pathlib; print(re.search(r'^__version__\s*=\s*[\"\']([^\"\']+)', pathlib.Path('bluetti_bt_connect_lib/__init__.py').read_text(), re.M).group(1))")"

          echo "requested: $REQUESTED"
          echo "packaged : $PACKAGED"

          if [ -z "$REQUESTED" ]; then
            echo "::error::No version supplied"
            exit 1
          fi

          if [ "$REQUESTED" != "$PACKAGED" ]; then
            echo "::error::Tag $REQUESTED does not match __version__ $PACKAGED - bump bluetti_bt_connect_lib/__init__.py before tagging"
            exit 1
          fi

          echo "version=$PACKAGED" >> "$GITHUB_OUTPUT"

      # The release notes come from CHANGELOG.md. A version without its own
      # section fails here, before anything is published.
      - name: Extract release notes
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}(?:[ \t][^\n]*)?\n(.*?)(?=^## |\Z)",
              text,
              re.M | re.S,
          )
          if not match or not match.group(1).strip():
              print(f"::error::CHANGELOG.md has no '## {version}' section")
              sys.exit(1)
          pathlib.Path("release_notes.md").write_text(
              match.group(1).strip() + "\n", encoding="utf-8"
          )
          PY
          cat release_notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

      - name: Build sdist and wheel
        env:
          LIB_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
    # API token is stored anywhere. Configure the publisher once at
    # https://pypi.org/manage/project/bluetti-bt-connect-lib/settings/publishing/
    # (repository Ellmondo/bluetti-bt-connect-lib, workflow publish.yml,
    # environment pypi).
    environment:
      name: pypi
      url: https://pypi.org/p/bluetti-bt-connect-lib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" --notes-file release_notes.md --verify-tag
          fi
